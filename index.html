<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Logística CannaCare</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: mesmo esqueleto do sistema atual (SB Admin 2) — barra lateral fixa à esquerda, conteúdo em cards brancos sobre fundo bege-cinza.
   Tema único (claro), igual ao sistema, por escolha. */
:root{
  --bg:#f2f3f0; --card:#ffffff; --line:#e3e6f0; --text:#858796; --dark:#5a5c69; --ink:#3b3b3b; --link:#282828;
  --purple:#5a2e88; --green-nav:#57b439; --success:#32aa60; --chart-green:#1cc88a; --danger:#e74a3b; --warning:#f6c23e; --info:#4e73df;
  --farol:#fdedef; --farol-warn:#fff8e6; --gray300:#dddfeb; --secondary:#858796;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
a{color:var(--ink)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside{background:var(--bg);padding:16px 0 24px;padding-left:max(0px,env(safe-area-inset-left,0px));position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.logo{width:46px;height:46px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 20px}
.sh{color:var(--purple);font-size:10.4px;font-weight:800;text-transform:uppercase;padding:14px 20px 4px;letter-spacing:.02em}
.nav{list-style:none;margin:0;padding:0}
.nav a{display:flex;align-items:center;gap:10px;color:var(--link);text-decoration:none;font-size:13px;padding:6px 20px;margin-right:14px;border-radius:0 20px 20px 0;text-transform:uppercase;font-weight:500;letter-spacing:.01em}
.nav a svg{width:14px;height:14px;flex:none;fill:currentColor}
.nav a:hover{background:#e6e8e2}
.nav a.sel{background:var(--green-nav);color:#fff}
.nav a.off{opacity:.55;pointer-events:none}
.nav .new{font-size:9px;background:var(--purple);color:#fff;border-radius:8px;padding:1px 6px;margin-left:auto;text-transform:none}
.nav .cnt{margin-left:auto;background:var(--danger);color:#fff;border-radius:9px;font-size:10px;padding:0 6px;font-weight:700}
.nav a.sel .cnt{background:#fff;color:var(--danger)}
hr.sd{border:0;border-top:1px solid #dcdfd7;margin:10px 20px}
main{padding:18px max(20px,env(safe-area-inset-right,0px)) 48px 12px;min-width:0}
h1{font-size:28px;font-weight:400;color:var(--dark);margin:6px 0 4px 6px}
.lead{margin:0 0 18px 6px;font-size:13px}
.card{background:var(--card);border-radius:6px;box-shadow:0 2px 28px rgba(58,59,69,.15);margin-bottom:22px;min-width:0}
.card-h{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h b{color:var(--ink);font-weight:700}
.card-b{padding:18px 20px}
.xs{font-size:11.2px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;margin-bottom:22px}
.kpi{background:var(--card);border-radius:6px;box-shadow:0 2px 28px rgba(58,59,69,.15);border-left:4px solid var(--ink);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:left;font:inherit;border-top:0;border-right:0;border-bottom:0}
.kpi .v{font-size:20px;font-weight:700;color:var(--dark);font-variant-numeric:tabular-nums}
.kpi svg{width:28px;height:28px;fill:var(--gray300)}
.k-ink{border-left-color:var(--ink)}.k-ink .xs{color:var(--ink)}
.k-ok{border-left-color:var(--success)}.k-ok .xs{color:var(--success)}
.k-dan{border-left-color:var(--danger)}.k-dan .xs{color:var(--danger)}
.k-war{border-left-color:var(--warning)}.k-war .xs{color:#c99a14}
.k-inf{border-left-color:var(--info)}.k-inf .xs{color:var(--info)}
.kpi[aria-pressed="true"]{outline:2px solid var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.grid-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:22px;align-items:start}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;color:var(--text);font-size:13.5px}
th,td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
th{font-weight:700;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.farol td{background:var(--farol)}
tr.farol-w td{background:var(--farol-warn)}
tbody tr:hover td{filter:brightness(.98)}
tr.click{cursor:pointer}
.muted{color:#b7b9cc}
.mono{font-family:var(--mono);font-size:12.5px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;border-radius:5px;padding:3px 7px;line-height:1.2;white-space:nowrap;vertical-align:middle}
.b-dan{background:var(--danger)}.b-war{background:var(--warning);color:#3b3b3b}.b-ok{background:var(--success)}.b-ink{background:var(--ink)}.b-dark{background:var(--dark)}.b-sec{background:var(--secondary)}.b-inf{background:var(--info)}.b-pur{background:var(--purple)}
.badge.big{font-size:18px;padding:6px 14px}
.btn{font:inherit;font-size:13px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:6px 12px;cursor:pointer}
.btn.out{background:transparent;color:var(--ink)}
.btn.sm{font-size:12px;padding:3px 8px}
.btn.green{background:var(--success);border-color:var(--success)}
input[type=search],select{font:inherit;font-size:13px;color:var(--dark);border:1px solid #d1d3e2;border-radius:3px;padding:6px 10px;background:#fff}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1;min-width:220px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.chips button{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:2px 10px;cursor:pointer}
.tabsx{display:flex;border-bottom:1px solid var(--line);gap:2px;flex-wrap:wrap;margin:0 0 -1px}
.tabsx button{font:inherit;font-size:13px;color:#6e707e;background:none;border:1px solid transparent;border-bottom:0;border-radius:5px 5px 0 0;padding:8px 14px;cursor:pointer}
.tabsx button[aria-selected="true"]{background:#fff;border-color:var(--line);color:var(--ink);font-weight:600}
.tabsx .c{display:inline-block;margin-left:6px;background:var(--danger);color:#fff;border-radius:8px;font-size:10px;padding:0 6px}
.stagebar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.stg{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stg[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stg .t{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--dark);display:block;min-height:28px}
.stg .v{font-size:22px;font-weight:700;color:var(--danger)}
.stg .v.zero{color:var(--success)}
.stg small{display:block;font-size:11px}
.meter{height:6px;background:#eaecf4;border-radius:3px;overflow:hidden;margin-top:4px;min-width:60px}
.meter i{display:block;height:100%;background:var(--danger)}
.meter i.w{background:var(--warning)}.meter i.o{background:var(--chart-green)}
/* rastreio */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px dashed #eceef4}
.tl li:last-child{border-bottom:0}
.tl .pin{width:10px;height:10px;border-radius:50%;background:var(--dark);margin-top:5px}
.tl li.ms .pin{background:var(--ink);box-shadow:0 0 0 3px #d9d9d9}
.tl li.crit .pin{background:var(--danger);box-shadow:0 0 0 3px #f7c9c4}
.tl li.fut .pin{background:#fff;border:2px solid var(--gray300)}
.tl li.fut{color:#b7b9cc}
.tl .ev{color:var(--dark)}
.tl small{display:block;font-size:11.5px;color:var(--text)}
.tl .d{font-size:12px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.alert{border-radius:6px;padding:12px 16px;margin-bottom:16px;font-size:13.5px}
.alert.dan{background:var(--farol);color:#a1281c;border:1px solid #f5c6cb}
.alert.war{background:var(--farol-warn);color:#7a5a00;border:1px solid #f5e3a6}
.alert.inf{background:#eef2fd;color:#2b4c9e;border:1px solid #cdd8f7}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;font-size:13px}
.kv dt{color:var(--text)}.kv dd{margin:0;color:var(--dark)}
.strike{text-decoration:line-through}
.prog{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin:6px 0 2px}
.prog i{height:8px;border-radius:2px;background:#eaecf4}
.prog i.d{background:var(--chart-green)}.prog i.n{background:var(--danger)}
.note{font-size:12px;color:var(--text);margin:6px 0 0 6px}
.chartbox{position:relative;height:250px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters label{display:grid;gap:3px}
.hide-sm{}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 6px}
  .logo{display:none}
  .sh,.nav li.other,hr.sd,.nav.oth{display:none}
  .nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .nav a{margin:0;border-radius:16px;white-space:nowrap;padding:6px 12px}
  main{padding:8px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stagebar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid-r{grid-template-columns:minmax(0,1fr)}
  .hide-sm{display:none}
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,tr.click:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
</style>
</head>
